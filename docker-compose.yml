services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: odense
      POSTGRES_PASSWORD: odense
      POSTGRES_DB: odense_rag
    ports:
      - "5433:5432"   # 5433 for ikke at kollidere med en lokal Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odense -d odense_rag"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://odense:odense@db:5432/odense_rag
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-anthropic:claude-haiku-5-5}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 300s   # første opstart bygger indekset (ca. 2-3 min.)

volumes:
  pgdata:
